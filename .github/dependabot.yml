# Dependabot version updates: weekly, grouped, few open PRs.
#
# - cooldown 14 days: a new version is proposed only when it is at least 14 days old (project rule
#   for new versions). It does not delay security updates.
# - npm: one root entry covers all workspaces (packages/*, site, scraper, infra) through the root
#   package-lock.json.
# - @types/node: no major updates. The types must match the Node runtime (.nvmrc, workflows and
#   engines use Node 24); newer types would allow APIs that Node 24 does not have. Raise the major
#   together with the runtime.
# - github-actions: the SHA pins in .github/workflows; Dependabot updates the SHA and the version
#   comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev:
        dependency-type: development
      prod:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci(deps)
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
